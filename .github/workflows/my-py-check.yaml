name: Mypy Strict Type Check

# 1. When should this action run?
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 2. What should it do?
jobs:
  type-check:
    name: Run Mypy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository's code onto the server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the correct version of Python
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Install and configure Poetry
      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      # Step 4: Install dependencies
      - name: Install dependencies
        run: poetry install --no-interaction

      # Step 5: Run the actual Mypy check!
      - name: Run type-check with Mypy
        run: poetry run mypy ./src/main.py ./src/exercises.py --strict