[project]
name = "oop"
version = "0.1.0"
description = "Learning OOP in Python."
authors = [
    {name = "Carlos Pizarro",email = "pizarro.c.barboza@outlook.com"}
]
requires-python = ">=3.10"
dependencies = [
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
types = [
    "mypy (>=2.3.0,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)"
]

[tool.poetry]
package-mode = false
